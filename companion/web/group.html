<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>구르는 가이드 여행 그룹</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <div class="banner hidden" id="banner" role="status"></div>
  <div class="top">
    <h1><span class="sub" id="who"></span><span id="title">구르는 가이드</span></h1>
    <span class="chip" id="carsChip"><span class="dot" id="liveDot"></span><span id="cars">-</span></span>
    <div class="lang"><button data-lang="ko" aria-label="한국어">한</button><button data-lang="en" aria-label="English">EN</button></div>
  </div>

  <section id="tab-now">
    <div class="card intro hidden" id="introCard">
      <h2 id="introTitle"></h2>
      <ul class="intro-list" id="introList"></ul>
      <button class="btn primary block" id="introOk" type="button"></button>
    </div>
    <div class="card treasure hidden" id="treasureCard">
      <div class="stars" id="treasureStars"></div>
      <div class="big" id="treasureTitle"></div>
      <div class="small" id="treasureText"></div>
    </div>
    <div class="card quiz hidden" id="quizCard">
      <div class="label"><span id="quizLabel"></span><span class="stars" id="quizStars" style="margin-left:auto"></span></div>
      <div class="q" id="quizQ"></div>
      <div class="choices" id="quizChoices"></div>
      <div class="result" id="quizResult"></div>
    </div>
    <div class="card now">
      <div class="label" id="nowLabel"></div>
      <div class="name" id="nowName"></div>
      <div class="stage gg-stage" id="stage"><video id="clip" class="clip hidden" muted playsinline loop autoplay preload="metadata"></video><button class="playbtn hidden" id="playBtn" type="button"></button></div>
      <div class="toggle"><button id="mVideo" class="on"></button><button id="mOrbit"></button></div>
      <div class="lines" id="lines"></div>
      <div class="row" style="margin-top:12px">
        <span class="small" id="nowSmall"></span>
        <button class="btn" id="report" style="margin-left:auto"></button>
      </div>
    </div>
    <div class="card handoff hidden" id="handoffCard">
      <h2 id="handoffTitle"></h2>
      <div class="text" id="handoffText"></div>
      <p class="small" id="handoffNote"></p>
      <button class="btn primary block" id="handoffBtn"></button>
    </div>
    <div class="card hidden" id="kidCard">
      <h2 id="kidTitle"></h2>
      <div class="kidline" id="kidText"></div>
    </div>
    <div class="card qa hidden" id="qaCard">
      <h2 id="qaTitle"></h2>
      <ul id="qaList"></ul>
    </div>
    <div class="card" id="meCard">
      <h2 id="meTitle"></h2>
      <input type="text" id="me" maxlength="20" autocomplete="nickname">
    </div>
  </section>

  <section id="tab-course" class="hidden">
    <div class="card course">
      <h2 id="courseTitle"></h2>
      <ul id="course"></ul>
    </div>
  </section>

  <section id="tab-pick" class="hidden">
    <div class="card">
      <h2 id="pickTitle"></h2>
      <div class="map" id="pickMap"></div>
      <p class="small" id="pickHelp"></p>
      <button class="btn primary block" id="sendPick" disabled></button>
      <p class="small" id="pickStatus" role="status"></p>
      <div class="picklist" id="picklist"></div>
    </div>
  </section>

  <section id="tab-record" class="hidden">
    <div class="card">
      <h2 id="recTitle"></h2>
      <div class="map" id="recMap"></div>
      <p class="small" id="recSummary"></p>
      <p class="small keep" id="keepRec"></p>
    </div>
    <div class="card hidden" id="basicCard">
      <p class="small" id="basicNote"></p>
    </div>
    <div class="card" id="photoCard">
      <h2 id="photoTitle"></h2>
      <p class="small" id="photoHelp"></p>
      <p class="small keep" id="keepPhoto"></p>
      <label class="btn primary block" for="photoInput" id="photoBtn"></label>
      <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
      <p class="small" id="photoStatus" role="status"></p>
      <div class="photos" id="photos"></div>
    </div>
    <div class="card" id="camCard">
      <h2 id="camTitle"></h2>
      <p class="small" id="camHelp"></p>
      <p class="small keep" id="keepCam"></p>
      <label class="btn block" for="camInput" id="camBtn"></label>
      <input type="file" id="camInput" accept="video/*" class="hidden">
      <p class="small" id="camStatus" role="status"></p>
      <button class="btn block hidden" id="camRetry" type="button"></button>
      <video id="hl" controls playsinline class="hidden"></video>
      <a class="btn block hidden" id="hlDown" download="trip-highlight.mp4" style="margin-top:8px;text-decoration:none"></a>
    </div>
  </section>
</div>

<nav class="tabs">
  <button data-tab="now" class="on" id="tNow"></button>
  <button data-tab="course" id="tCourse"></button>
  <button data-tab="pick" id="tPick"></button>
  <button data-tab="record" id="tRecord"></button>
</nav>
<div class="toast" id="toast"></div>

<script src="/vendor/three.min.js" defer></script>
<script src="/vendor/leaflet.js" defer></script>
<script src="/js/viewer.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>
