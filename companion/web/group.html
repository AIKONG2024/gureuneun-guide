<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1015">
<meta name="color-scheme" content="dark">
<title>구르는 가이드</title>
<link rel="stylesheet" href="/vendor/fonts/asta-sans/asta-sans.css">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="banner hidden" id="banner" role="status"></div>
<div class="app">
  <header class="top">
    <span class="mark" aria-hidden="true"><svg viewBox="33 27 49 49" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><path d="M47.52 64.8H58.68C62.28 64.8 64.44 62.28 64.44 59.22C64.44 55.98 62.1 53.64 59.04 53.64H48.96C45.9 53.64 43.56 51.3 43.56 48.24C43.56 45.18 45.72 43.2 48.96 43.2H60.48"/><circle cx="43.2" cy="64.8" r="4.32"/><circle cx="64.8" cy="43.2" r="4.32"/><circle cx="73.5" cy="34.5" r="4.6" fill="#00AAD2" stroke="none"/></svg></span>
    <h1 id="title"></h1>
    <button class="chip" id="meBtn" type="button"><span id="meName"></span></button>
    <button class="chip" id="langBtn" type="button"></button>
  </header>

  <section id="tab-now" aria-labelledby="tNow">
    <div class="stage" id="stage">
      <img class="ph" id="phA" alt="" decoding="async">
      <img class="ph" id="phB" alt="" decoding="async">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <a class="credit" id="credit" target="_blank" rel="noopener"></a>
    </div>
    <h2 class="place" id="nowName"></h2>
    <div class="lines" id="lines"></div>
    <button class="more hidden" id="toRecord" type="button"><span id="toRecordL"></span><i data-ic="chevron"></i></button>

    <article class="quiz hidden" id="quizCard">
      <div class="stars" id="quizStars"></div>
      <h3 id="quizQ"></h3>
      <div class="choices" id="quizChoices"></div>
      <p class="result" id="quizResult" role="status"></p>
    </article>

    <ol class="places hidden" id="course"></ol>
  </section>

  <section id="tab-pick" class="hidden" aria-labelledby="tPick">
    <div class="map" id="pickMap"></div>
    <div id="picklist"></div>
    <div class="sendbar">
      <p class="pick-status" id="pickStatus" role="status"></p>
      <button class="btn primary" id="sendPick" type="button" disabled></button>
    </div>
  </section>

  <section id="tab-record" class="hidden" aria-labelledby="tRecord">
    <p class="blank" id="recEmpty"></p>
    <article class="card hidden" id="card">
      <div class="stage cover">
        <img class="ph on" id="recCover" alt="">
        <a class="credit" id="recCredit" target="_blank" rel="noopener"></a>
      </div>
      <h2 class="place" id="recTitle"></h2>
      <p class="card-date" id="recDate"></p>
      <p class="card-fact" id="recFact"></p>
      <div class="map" id="recMap"></div>
      <ol class="places" id="recPlaces"></ol>
      <button class="btn primary" id="saveCard" type="button"></button>
      <p class="keep" id="keepNote"></p>
    </article>
  </section>

  <section class="problem hidden" id="problem">
    <h2 id="problemTitle"></h2>
    <p id="problemText"></p>
    <a class="btn" href="/" id="problemBtn"></a>
  </section>
</div>

<nav class="tabs" id="tabs" role="tablist">
  <button data-tab="now" class="on" id="tNow" type="button" role="tab" aria-selected="true"><i data-ic="speaker"></i><span id="tNowL"></span><span class="badge hidden"></span></button>
  <button data-tab="pick" id="tPick" type="button" role="tab" aria-selected="false"><i data-ic="pin"></i><span id="tPickL"></span></button>
  <button data-tab="record" id="tRecord" type="button" role="tab" aria-selected="false"><i data-ic="route"></i><span id="tRecordL"></span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><span class="toast-act" id="toastAct"></span></div>

<div class="sheet-wrap hidden" id="sheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <input type="text" id="me" maxlength="20" autocomplete="nickname" enterkeyhint="done" aria-labelledby="sheetTitle">
    <p class="hint" id="meHint"></p>
    <button class="btn primary" id="sheetOk" type="button"></button>
  </div>
</div>

<script src="/vendor/leaflet.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>
