<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<meta name="format-detection" content="telephone=no">
<title>우리 여행 · 구르는 가이드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/vendor/asta-sans/asta-sans.css">
<link rel="stylesheet" href="/web/app.css">
</head>
<body data-tab="now">
<div class="app" id="app">
  <header class="hd" id="hd">
    <button class="hd-btn hd-me" data-act="pick-me" id="hdMe" aria-label="나 바꾸기"></button>
    <div class="hd-t"><b>우리 여행</b><small id="hdSub">&nbsp;</small></div>
    <button class="hd-btn hd-share" data-act="share-trip" aria-label="여행 링크 보내기"><i data-ic="share" data-s="22"></i></button>
  </header>
  <button class="pill" id="pill" data-act="pill" type="button"></button>
  <div class="net" id="net">연결이 끊겼어요. 다시 연결하는 중이에요</div>
  <main class="main">
    <section class="panel" id="p-now">
      <div id="nowBox"></div>
      <div class="sec"><b>오늘 담은 곳</b><button class="sec-a" data-act="tab" data-tab="add"><i data-ic="plus" data-s="15" data-w="2.4"></i>담기</button></div>
      <div class="card list" id="todayList"></div>
      <div class="sec" id="heardSec" hidden><b>다시 보기</b><span id="heardCount"></span></div>
      <div class="card list" id="heardList" hidden></div>
    </section>
    <section class="panel" id="p-add">
      <div class="card form">
        <div class="k">링크 붙여 넣기</div>
        <div class="inp" id="inpBox">
          <i data-ic="link" data-s="17" class="inp-ic"></i>
          <span class="inp-pretty" id="pretty"></span>
          <input id="link" type="url" inputmode="url" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="블로그, 지도 앱, 인스타그램 링크" aria-label="장소 링크">
          <button type="button" class="inp-paste" data-act="paste">붙여 넣기</button>
          <button type="button" class="inp-x" data-act="clear" aria-label="지우기"><i data-ic="x" data-s="12" data-w="3"></i></button>
        </div>
        <div class="ex"><span>예시</span><button type="button" data-act="example" data-i="0">블로그 · 황리단길 카페</button><button type="button" data-act="example" data-i="1">인스타그램 · 교촌마을</button></div>
        <div id="pv"></div>
        <button type="button" class="who" data-act="pick-me" id="addWho"></button>
        <button type="button" class="go" data-act="add" id="addBtn" disabled></button>
      </div>
      <div class="sec"><b>이미 담긴 장소</b><span id="addedCount"></span></div>
      <div class="card list" id="addedList"></div>
    </section>
    <section class="panel" id="p-plan">
      <div id="etaBox"></div>
      <div class="sec"><b>오늘 일정</b><span id="planDate"></span></div>
      <div class="card tl" id="planList"></div>
      <div class="sec" id="laterSec" hidden><b>가까워지면 제안</b><span id="laterCount"></span></div>
      <p class="note" id="laterNote" hidden>시간을 정하기 어려운 곳은 근처를 지날 때 차가 먼저 들를지 물어봐요</p>
      <div class="card list" id="laterList" hidden></div>
      <div class="sec"><b>일행</b><span id="memCount"></span></div>
      <div class="card" id="memList"></div>
      <p class="foot"><i data-ic="shield-check" data-s="14"></i>실시간 위치는 본인이 직접 켠 경우에만 일행에게 보여요</p>
    </section>
    <section class="panel" id="p-rec">
      <div id="recTop"></div>
      <div class="sec" id="upSec" hidden><b>올린 사진</b><span id="upCount"></span></div>
      <div class="grid" id="upGrid" hidden></div>
    </section>
  </main>
  <nav class="tab" id="tabbar">
    <button type="button" data-act="tab" data-tab="now"><i data-ic="audio-lines" data-s="24"></i><span>지금</span></button>
    <button type="button" data-act="tab" data-tab="add"><i data-ic="circle-plus" data-s="24"></i><span>담기</span></button>
    <button type="button" data-act="tab" data-tab="plan"><i data-ic="route" data-s="24"></i><span>일정</span></button>
    <button type="button" data-act="tab" data-tab="rec"><i data-ic="film" data-s="24"></i><span>기록</span><em class="dot"></em></button>
  </nav>
</div>
<div class="ov who-ov" id="whoOv"></div>
<div class="ov sheet-ov" id="sheetOv" data-act="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div class="ov player" id="player">
  <button type="button" class="pl-x" data-act="close-player" aria-label="닫기"><i data-ic="x" data-s="22" data-w="2.4"></i></button>
  <div class="pl-box" id="plBox"></div>
  <p class="pl-hint">가로로 돌리면 크게 볼 수 있어요</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="/web/vendor/lucide.min.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
