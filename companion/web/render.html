<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구르는 가이드 영상 클립 만들기</title>
<style>body{margin:0;background:#0E1015;color:#C7C9CE;font:14px sans-serif}#stage{width:1280px;height:720px}#log{padding:10px}</style>
</head>
<body>
<div id="log">준비 중</div>
<div id="stage"></div>
<script src="vendor/three.min.js"></script>
<script src="js/viewer.js"></script>
<script>
  // 개발용 페이지: 3D 장면을 프레임 단위로 그려 서버로 보내고, 서버가 ffmpeg 로 MP4 클립을 만든다.
  // 사용: /render.html?models=cheomseongdae,tumuli&seconds=8&fps=30
  var q = new URLSearchParams(location.search);
  var models = (q.get('models') || '').split(',').filter(Boolean);
  var seconds = Number(q.get('seconds') || 8), fps = Number(q.get('fps') || 30);
  var W = Number(q.get('w') || 1280), H = Number(q.get('h') || 720);
  var log = document.getElementById('log');
  GG.mount(document.getElementById('stage'), { model: models[0] || 'cheomseongdae' });
  function post(url, body) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then(function (r) { return r.json(); }); }
  async function run() {
    for (const m of models) {
      const name = m + (q.get('night') === '1' ? '_night' : '');
      await post('/api/render/start', { name: name });
      let batch = [], start = 0;
      await GG.renderFrames({ model: m, seconds: seconds, fps: fps, width: W, height: H, night: q.get('night') === '1' }, function (data, i, total) {
        batch.push(data);
        log.textContent = name + ' ' + (i + 1) + '/' + total;
        if (batch.length === 15 || i === total - 1) {
          const frames = batch; batch = [];
          const s = start; start += frames.length;
          return post('/api/render/frames', { name: name, start: s, frames: frames });
        }
      });
      const res = await post('/api/render/done', { name: name, fps: fps });
      log.textContent = name + ' 완료 ' + JSON.stringify(res);
    }
    log.textContent = 'ALL_DONE';
    document.title = 'ALL_DONE';
  }
  setTimeout(run, 1500);
</script>
</body>
</html>
