<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>구르는 가이드 s1b</title>
<style>
/* 구르는 가이드 시연 필름
   레퍼런스(Pleos Connect 공식 필름, Google Gemini in Android Auto, 현대모비스, Tesla)처럼 글씨는 작게, 상자와 번짐 없이.
   색은 화면 속 UI에만 쓰고 바깥은 무채색(밝은 회색 스튜디오, 현대 샌드, 검정). 글꼴은 Pleos 와 같은 Asta Sans */
@font-face{font-family:Asta;src:url(../assets/fonts/asta_regular.otf);font-weight:400}
@font-face{font-family:Asta;src:url(../assets/fonts/asta_medium.otf);font-weight:500}
@font-face{font-family:Asta;src:url(../assets/fonts/asta_semibold.otf);font-weight:600}
@font-face{font-family:Asta;src:url(../assets/fonts/asta_bold.otf);font-weight:700}
@font-face{font-family:Asta;src:url(../assets/fonts/asta_extrabold.otf);font-weight:800}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Asta;color:#F5F6F7;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#000}
.scene.dark{background:#000}

/* 실내 이미지와 그 속 화면 */
.cam{position:absolute;left:0;top:0;width:1920px;height:1081px}
.plate{position:absolute;left:0;top:0;width:1920px;height:1081px}
.scr{position:absolute;overflow:hidden;border-radius:5px;background:#000}
.scr video{position:absolute;filter:brightness(.9) saturate(1.02)}
.scr .gl{position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,.07),rgba(255,255,255,0) 36%);box-shadow:inset 0 0 16px rgba(0,0,0,.5)}
.strip{position:absolute;height:4px;border-radius:3px;mix-blend-mode:screen;transform-origin:left center}
.strip.warmw{background:#FFE6C4;box-shadow:0 0 8px 2px rgba(255,214,160,.6),0 0 26px 6px rgba(255,200,130,.22);opacity:.8}
.strip.cool{background:#DCEBFF;box-shadow:0 0 8px 2px rgba(190,220,255,.55),0 0 26px 6px rgba(160,200,255,.2);opacity:.9}
.strip.goldw{background:#F2CF98;box-shadow:0 0 10px 3px rgba(242,207,152,.7),0 0 34px 8px rgba(217,168,102,.3);opacity:.95}
.dimmer{position:absolute;inset:0;background:#02040A;opacity:0}
.warm{position:absolute;inset:0;opacity:0;mix-blend-mode:soft-light;background:radial-gradient(1300px 700px at 60% 45%,rgba(255,200,120,.9),rgba(217,168,102,.5) 55%,rgba(150,100,40,.35))}
.sweep{position:absolute;left:0;top:-300px;width:700px;height:1700px;opacity:0;mix-blend-mode:screen;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,214,150,0),rgba(255,214,150,.12) 30%,rgba(255,236,200,.5) 50%,rgba(255,214,150,.12) 70%,rgba(255,214,150,0));filter:blur(10px)}
.flash{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(1100px 620px at 50% 58%,rgba(255,226,170,.7),rgba(242,207,152,.25) 45%,rgba(217,168,102,0) 75%)}

/* 창밖 라벨: 앞유리 HUD 처럼 글자와 가는 선만 */
.ar{position:absolute;opacity:0;z-index:30;color:#fff}
.ar .t{display:block;font-weight:600;font-size:30px;letter-spacing:-.01em;text-shadow:0 1px 14px rgba(0,0,0,.55)}
.ar .t i{font-style:normal;color:#9FE6F5;margin-right:8px}
.ar .t small{font-weight:500;font-size:24px;opacity:.75;margin-left:8px}
.ar .ln{display:block;width:1.5px;height:118px;margin:10px 0 0 6px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.15))}
.ar .ring{display:block;width:14px;height:14px;margin:-2px 0 0 0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(0,0,0,.35)}

/* 사진 장면 */
.photo{position:absolute;inset:0;overflow:hidden;opacity:0;z-index:10}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.photo .vign{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 26%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5))}
.photo .credit{position:absolute;right:30px;top:24px;font-weight:500;font-size:15px;color:rgba(255,255,255,.55)}

/* 자막: 상자 없이 흰 글씨. 차가 말할 때만 아래에 얇은 빛 선 (Pleos Gleo, Gemini 처럼) */
.sub{position:absolute;left:0;right:0;bottom:74px;display:flex;justify-content:center;opacity:0;z-index:50}
.sub span{position:relative;display:inline-block;max-width:1500px;font-weight:500;font-size:32px;line-height:1.35;color:#fff;text-align:center;
  text-shadow:0 1px 3px rgba(0,0,0,.45),0 2px 18px rgba(0,0,0,.35)}
.sub em{font-style:normal;font-weight:500;color:rgba(255,255,255,.62);margin-right:14px}
.sub.car span::after{content:'';position:absolute;left:50%;bottom:-20px;width:176px;height:3px;margin-left:-88px;border-radius:2px;
  background:linear-gradient(90deg,rgba(110,124,255,0),#6E7CFF 28%,#A9BCFF 50%,#6E7CFF 72%,rgba(110,124,255,0));box-shadow:0 0 10px rgba(110,124,255,.65)}
.sub.ink span{color:#1B2128;text-shadow:none}
.sub.ink{bottom:48px}
.sub.ink span{font-size:30px}
.sub.ink em{color:rgba(27,33,40,.5)}
.listen{position:absolute;left:50%;bottom:66px;width:176px;height:3px;margin-left:-88px;border-radius:2px;opacity:0;z-index:50;
  background:linear-gradient(90deg,rgba(0,170,210,0),#00AAD2 28%,#7FE3F7 50%,#00AAD2 72%,rgba(0,170,210,0));box-shadow:0 0 10px rgba(0,170,210,.6)}

/* 장 제목: 왼쪽 위 작은 글씨 (현대모비스 필름처럼) */
.chap{position:absolute;left:96px;top:70px;display:flex;align-items:center;gap:14px;opacity:0;z-index:40;font-weight:600;font-size:26px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.chap::before{content:'';width:22px;height:2px;background:#00AAD2}
.chap.ink{color:#1B2128;text-shadow:none}

/* 화면을 띄우는 스튜디오 (Pleos 필름의 밝은 회색, 경주는 현대 샌드) */
.studio{position:absolute;inset:0;background:radial-gradient(1500px 900px at 50% 38%,#F5F6F7 0%,#E9EBED 55%,#DCDFE2 100%)}
.studio.sand{background:radial-gradient(1500px 900px at 50% 38%,#F8F5F1 0%,#EEE7DE 55%,#E2D9CE 100%)}
.stage{position:absolute;inset:0;perspective:2400px;transform-style:preserve-3d}
.card{position:absolute;border-radius:22px;overflow:hidden;background:#0B0D10;opacity:0;border:10px solid #0B0D10;box-sizing:content-box;
  box-shadow:0 36px 70px rgba(18,26,34,.26),0 10px 22px rgba(18,26,34,.14)}
.card.car video{position:absolute}
.card .sheen{position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.06),rgba(255,255,255,0) 30%);pointer-events:none}
.card.phone{padding:0;border:11px solid #0B0C0E;border-radius:50px;background:#0B0C0E}
.card.phone .bezel{position:relative;width:100%;height:100%;border-radius:39px;overflow:hidden;background:#fff}
.card.phone video{position:absolute;left:0;top:0}
.navi{position:absolute;right:120px;bottom:150px;width:600px;opacity:0;z-index:20}
.navi .card{position:relative;width:580px;height:417px;opacity:1;border-width:8px;border-radius:16px}
.navi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.navi .lab{margin:14px 0 0 4px;font-weight:500;font-size:20px;color:#5A626B}
.signal{position:absolute;left:50%;top:66px;width:64px;height:64px;margin-left:-32px;opacity:0;z-index:40}
.signal svg{width:64px;height:64px}
.reelwrap{position:absolute;inset:0;z-index:25;opacity:0}
.reelpop{position:absolute;overflow:hidden;background:#000}
.reelpop video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.fam{position:absolute;width:300px;height:649px;border-radius:40px;opacity:0;transform:rotate(var(--r));overflow:hidden;border:9px solid #0B0C0E;
  background:#0B0C0E;box-shadow:0 30px 60px rgba(18,26,34,.24),0 8px 18px rgba(18,26,34,.12)}
.fam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.95) brightness(.97)}
.fam b{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:600;font-size:20px;color:#fff;box-shadow:0 0 0 3px #fff}

/* 제목과 끝: 검정 바탕에 작은 글씨 */
.title-bg{position:absolute;inset:0;background:#000}
.ask{position:absolute;left:0;right:0;top:500px;text-align:center;font-weight:500;font-size:54px;letter-spacing:-.015em;color:#F5F6F7;opacity:0}
.lock{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:22px;opacity:0;transform:translate(-50%,-50%)}
.lock .mark{width:76px;height:76px}
.lock h1{margin:0;font-weight:600;font-size:46px;letter-spacing:-.015em;color:#F5F6F7}
.lock p{margin:4px 0 0;font-weight:500;font-size:21px;color:#8A939C}
.end{position:absolute;left:0;right:0;top:400px;text-align:center;opacity:0}
.end .mark{width:84px;height:84px}
.end h1{margin:22px 0 0;font-weight:600;font-size:50px;letter-spacing:-.015em;color:#F5F6F7}
.end p{margin:8px 0 0;font-weight:500;font-size:22px;color:#8A939C}
.end .sdk{margin-top:40px;font-weight:500;font-size:17px;letter-spacing:.01em;color:#5E666F}
.foot{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-weight:500;font-size:17px;line-height:1.6;color:#6A727B;opacity:0}

/* 움직임 */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes push2{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes push6{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes arIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes photoIn{from{opacity:1;clip-path:inset(0 0 0 100%)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes kb1{from{transform:scale(1.14) translate(2%,1%)}to{transform:scale(1.02) translate(0,0)}}
@keyframes kb2{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-2%,-1.2%)}}
@keyframes subIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes chapIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes listenIn{0%{opacity:0;transform:scaleX(.4)}100%{opacity:1;transform:scaleX(1)}}
@keyframes phoneIn{from{opacity:0;transform:translateX(-70px) rotateY(22deg) rotateX(4deg)}to{opacity:1;transform:rotateY(12deg) rotateX(2deg)}}
@keyframes phoneOut{from{opacity:1;transform:rotateY(12deg) rotateX(2deg)}to{opacity:0;transform:translateX(-180px) rotateY(22deg) rotateX(2deg)}}
@keyframes carIn{from{opacity:0;transform:translateX(70px) rotateY(-16deg) rotateX(3deg)}to{opacity:1;transform:rotateY(-8deg) rotateX(1.5deg)}}
@keyframes carCenter{from{opacity:1;transform:rotateY(-8deg) rotateX(1.5deg)}to{opacity:1;transform:translateX(-270px) translateY(-8px) scale(1.07)}}
@keyframes carL{from{opacity:0;transform:translateX(-60px) rotateY(14deg) rotateX(2deg)}to{opacity:1;transform:rotateY(6deg) rotateX(1.5deg)}}
@keyframes carL2{from{opacity:0;transform:rotateY(6deg) rotateX(1.5deg) scale(.99)}to{opacity:1;transform:rotateY(6deg) rotateX(1.5deg)}}
@keyframes phoneR{from{opacity:0;transform:translateX(60px) rotateY(-20deg) rotateX(2deg)}to{opacity:1;transform:rotateY(-10deg) rotateX(1.5deg)}}
@keyframes phoneR2{from{opacity:0;transform:rotateY(-10deg) rotateX(1.5deg) scale(.99)}to{opacity:1;transform:rotateY(-10deg) rotateX(1.5deg)}}
@keyframes phoneUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes famIn{from{opacity:0;transform:translateY(46px) rotate(var(--r)) scale(.94)}to{opacity:1;transform:rotate(var(--r))}}
@keyframes naviIn{from{opacity:0;transform:perspective(1600px) translateX(70px) rotateY(-30deg)}to{opacity:1;transform:perspective(1600px) rotateY(-10deg)}}
@keyframes naviOut{from{opacity:1;transform:perspective(1600px) rotateY(-10deg)}to{opacity:0;transform:perspective(1600px) translateX(60px) rotateY(-26deg)}}
@keyframes dimDown{from{opacity:.9}to{opacity:.28}}
@keyframes goldOn{0%{opacity:.28;background:#DCEBFF}35%{opacity:1;background:#FFF1D6;box-shadow:0 0 16px 5px rgba(255,226,170,.9),0 0 60px 16px rgba(217,168,102,.5)}100%{opacity:1;background:#F2CF98;box-shadow:0 0 10px 3px rgba(242,207,152,.75),0 0 36px 9px rgba(217,168,102,.32)}}
@keyframes dimIn{from{opacity:0}to{opacity:.3}}
@keyframes dimOut{from{opacity:.3}to{opacity:.04}}
@keyframes warmIn{from{opacity:0}to{opacity:.62}}
@keyframes flash{0%{opacity:0}25%{opacity:.6}100%{opacity:0}}
@keyframes sweep{0%{opacity:0;transform:translateX(-900px) rotate(14deg)}20%{opacity:1}100%{opacity:0;transform:translateX(2300px) rotate(14deg)}}
@keyframes blink{0%,54%{opacity:1}55%,100%{opacity:.15}}
@keyframes reelpop{from{left:var(--x);top:var(--y);width:var(--w);height:var(--h);border-radius:5px}to{left:0;top:0;width:1920px;height:1080px;border-radius:0}}
@keyframes askIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lockIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes endIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== v5: 한 컷에 한 동작, 3D 지도, 실내 시점 ===== */
.lock.ink h1{color:#1B2128}
.lock.ink p{color:#6A727B}
canvas#gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.shade{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55));z-index:19}
/* 누르는 자리와 단계 글자 */
.tap{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:3px solid #00AAD2;opacity:0;z-index:35}
.stp{position:absolute;display:flex;align-items:center;gap:12px;opacity:0;z-index:36;font-weight:600;font-size:27px;color:#1B2128;white-space:nowrap}
.stp b{font-weight:600;font-size:18px;color:#00AAD2}
.stp.r::after{content:'';width:52px;height:1.5px;background:rgba(27,33,40,.45)}
.stp.up{font-size:24px}
.stp.lt{font-size:23px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.stp.dn::before{content:'';position:absolute;left:50%;top:-36px;width:1.5px;height:28px;background:rgba(27,33,40,.45)}
.hl{position:absolute;border:2.5px solid #00AAD2;border-radius:14px;opacity:0;z-index:34}
.link{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:33;overflow:visible}
.link path{fill:none;stroke:#00AAD2;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.dot{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:#00AAD2;box-shadow:0 0 0 5px rgba(0,170,210,.22);opacity:0;z-index:34;offset-rotate:0deg}
/* 3D 지도 위 글자: 글자와 가는 선만 */
.l3{position:absolute;left:0;top:0;z-index:20;white-space:nowrap}
.l3 .in{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;opacity:0}
.l3 .t{font-weight:600;font-size:25px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)}
.l3 .t.sm{font-weight:500;font-size:21px}
.l3 .t small{font-weight:500;font-size:20px;opacity:.72;margin-left:8px}
.l3 .t i{font-style:normal;color:#9FE6F5;margin-right:9px}
.l3.g .t i{color:#F2CF98}
.l3 .ln{width:1.5px;height:46px;margin-top:8px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.1))}
.l3 img{width:216px;height:144px;object-fit:cover;border-radius:10px;margin-bottom:10px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.l3.sr .in{left:26px;bottom:auto;top:-18px;transform:none;align-items:flex-start}
.l3.sl .in{left:auto;right:26px;bottom:auto;top:-18px;transform:none;align-items:flex-end}
.l3.sr .ln,.l3.sl .ln{display:none}
.l3.sr .t small,.l3.sl .t small{margin:0 8px 0 0}
.card.inset{z-index:26}
.navi.dk .lab{color:#C9D1D9;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.credit3{position:absolute;left:40px;bottom:26px;font-weight:500;font-size:14px;color:rgba(255,255,255,.42);z-index:30}
/* 실내 시점: 창밖(영상, 이미지) 위에 창을 뚫은 실내 이미지 */
.win{position:absolute;left:0;top:0;width:1920px;height:1081px;overflow:hidden;background:#101418}
.win video,.win img{position:absolute;left:0;width:1920px}
.win video{filter:saturate(.8) sepia(.3) brightness(.95) contrast(1.03)}
.win video.dusk{filter:sepia(.6) saturate(1.5) brightness(.8) contrast(1.06)}
.win .tint{position:absolute;inset:0;mix-blend-mode:overlay;background:linear-gradient(rgba(255,176,96,.6),rgba(255,150,70,.3) 45%,rgba(120,70,30,.2))}
.win img.bl{filter:blur(22px);transform:scale(1.3)}
.cab{position:absolute;left:0;top:0;width:1920px;height:1081px}
.boom{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;z-index:8;background:radial-gradient(1300px 560px at 50% 30%,rgba(255,238,205,.95),rgba(255,214,150,.42) 42%,rgba(217,168,102,0) 74%)}
.enter{position:absolute;left:0;right:0;top:226px;text-align:center;color:#fff;opacity:0;z-index:9;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.enter small{display:block;font-weight:500;font-size:25px;letter-spacing:.02em;opacity:.92}
.enter b{display:block;font-weight:600;font-size:80px;letter-spacing:.1em;margin:2px 0 0 .1em;line-height:1.15}
.enter i{display:block;width:110px;height:2px;margin:12px auto 0;background:#F2CF98}
/* 기록: 사진이 모여 영상으로 */
.th{position:absolute;width:120px;height:80px;border-radius:9px;overflow:hidden;opacity:0;z-index:22;box-shadow:0 10px 24px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.92)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.lead{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:21}
.lead line{stroke:rgba(255,255,255,.6);stroke-width:1.5;opacity:0}
.reelcard{position:absolute;left:640px;top:360px;width:640px;height:360px;border-radius:14px;overflow:hidden;opacity:0;z-index:24;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.reelcard img{width:100%;height:100%;object-fit:cover;display:block}
.ing{position:absolute;left:0;right:0;top:296px;text-align:center;font-weight:500;font-size:27px;color:#fff;opacity:0;z-index:25;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.ing b{font-weight:600;color:#F2CF98}
.reelfull{position:absolute;inset:0;background:#000}
.reelfull video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover}
/* 지금까지는: 휴대폰에서 찾고 내비게이션에 다시 입력하던 방식 (설명용 그림) */
.mk-ph{position:absolute;inset:0;background:#F4F5F7;padding:62px 22px 0;color:#1B2128}
.mk-h{font-weight:700;font-size:25px;margin:0 6px 18px}
.mk-it{display:flex;align-items:center;gap:16px;height:112px;margin-bottom:14px;padding:0 16px;border-radius:20px;background:#fff;opacity:.45}
.mk-it img,.mk-it .ic{width:76px;height:76px;border-radius:14px;object-fit:cover;flex:none}
.mk-it .ic{display:grid;place-items:center;background:#F1E7DC}
.mk-it b{display:block;font-weight:600;font-size:23px}
.mk-it small{display:block;margin-top:5px;font-weight:500;font-size:17px;color:#6A727B}

@keyframes riseIn{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}

@keyframes insetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(70px)}}
@keyframes gatePush{from{transform:scale(.8)}to{transform:scale(3.4)}}
@keyframes roadPush{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes cabDim{from{filter:brightness(1)}to{filter:brightness(.55)}}

@keyframes thIn{from{opacity:0;transform:translateY(14px) scale(.8)}to{opacity:1;transform:none}}
@keyframes thFly{from{opacity:1;transform:none}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@keyframes rcIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes rcFull{from{opacity:1;transform:scale(1);border-radius:14px}to{opacity:1;transform:scale(3);border-radius:0}}
@keyframes mkOn{from{opacity:.45}to{opacity:1}}
@keyframes mkOff{from{opacity:1}to{opacity:.45}}
@keyframes fIn{from{opacity:0;border-color:transparent}to{opacity:1;border-color:#00AAD2}}
@keyframes fDone{from{border-color:#00AAD2}to{border-color:transparent}}
@keyframes typeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
