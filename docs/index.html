<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06111D">
<title>구르는 가이드 시연 영상</title>
<style>
  /* 앱과 같은 색: 현대 블루 #002C5F, 액티브 블루 #00AAD2 */
  :root { --bg: #070A0E; --text: #F2F4F6; --text2: #AAB2BA; --accent: #00AAD2; --sky: #7FD6EA; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: radial-gradient(1200px 640px at 12% -12%, rgba(0,44,95,.85), rgba(0,44,95,.2) 55%, transparent 80%), var(--bg); background-repeat: no-repeat; }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 20px 72px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .mark { width: 56px; height: 56px; flex: none; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .one { color: var(--sky); font-size: 18px; font-weight: 600; margin: 4px 0 0; }
  video { display: block; width: 100%; border-radius: 18px; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  p { color: var(--text2); line-height: 1.75; font-size: 16px; word-break: keep-all; }
  a { color: var(--accent); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <header>
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="34" fill="#0B4A8F"/>
      <path d="M24 52 q9 -10 18 0 t18 0 t18 0 t18 0" stroke="#00AAD2" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M24 76 q9 -10 18 0 t18 0 t18 0 t18 0" stroke="#BFE6F2" stroke-width="9" fill="none" stroke-linecap="round"/></svg>
    <div>
      <h1>구르는 가이드</h1>
      <p class="one">내 차의 여행 모드</p>
    </div>
  </header>
  <video controls preload="metadata" poster="demo/poster.jpg" src="demo/gureuneun-guide-demo.mp4"></video>
  <p>서울에서 경주로 가는 가족 여행 하루를 따라가는 시연 영상입니다.</p>
  <p>소스 코드, 실행 방법, APK: <a href="https://github.com/AIKONG2024/gureuneun-guide">github.com/AIKONG2024/gureuneun-guide</a></p>
</main>
</body>
</html>
